[package]
name = "incline"
version = "0.1.3"
edition = "2024"
description = "Incline is a free source-available mine design project"
repository = "https://github.com/Incline-Mine-Designer/Incline"
license-file = "LICENSE.md"
keywords = ["mining", "cad", "design"]
categories = ["graphics", "science"]
exclude = [
    "target/",
    "docs/",
    "tutorial/"
]

[build-dependencies]
winresource = "0.1.31"

[dependencies]
anyhow = "1.0.103"
glam = { version = "0.33.2", features = ["serde"] }
dxf = "0.6.1"
log = "0.4.33"
lyon = "1.0.19"
pollster = "0.4.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
wgpu = "29.0.3"
winit = "0.30.13"
# Fork of glyphon with world-space transform support; view_proj is applied
# in the vertex shader so prepare() output is camera-independent.
glyphon = { version = "0.10", git = "https://github.com/trimental/glyphon.git", rev = "322b7dba28b8b402caed7fec0b83a8e1cc731a31" }
twox-hash = "2.1.2"
egui = "0.35.0"
egui-winit = "0.35.0"
egui-wgpu = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false, features = ["svg"] }
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.2"
lazy_static = "1.5.0"
rayon = "1.12.0"
spade = "2.15.1"
chrono = "0.4.45"
colored = "3.1.1"
earcut = "0.4.10"
robust = "1.2"
memmap2 = "0.9.9"
snap = "1.1.1"
dirs = "6.0.0"
laz = "0.12.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[dependencies.bytemuck]
version = "1.25.0"
features = ["derive"]

[dev-dependencies]
# Pinned to wgpu's bundled naga so shader-validation tests parse/validate the
# same WGSL the renderer compiles at runtime.
naga = { version = "29.0.3", features = ["wgsl-in"] }
